name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK 27.2.12479018
        run: |
          echo "y" | sdkmanager "ndk;27.2.12479018" || echo "y" | sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
      - name: Descargar nucleo de Nintendo DS (melonDS, libretro)
        continue-on-error: true
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p app/src/main/jniLibs/$abi
            if curl -fsSL "https://buildbot.libretro.com/nightly/android/$abi/latest/melonds_libretro_android.so.zip" -o /tmp/melonds-$abi.zip && unzip -o -j /tmp/melonds-$abi.zip -d /tmp/melonds-$abi; then
              mv /tmp/melonds-$abi/melonds_libretro_android.so app/src/main/jniLibs/$abi/libmelonds.so
              echo "Nucleo DS listo para $abi"
            else
              echo "AVISO: no se pudo descargar el nucleo DS para $abi (la app compila igual, sin DS)"
            fi
          done
          ls -lh app/src/main/jniLibs/arm64-v8a/ || true
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gba-library-app
          path: app/build/outputs/apk/release/*.apk
