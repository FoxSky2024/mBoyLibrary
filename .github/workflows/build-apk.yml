name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Descargar nucleo de Nintendo DS (melonDS, libretro)
        continue-on-error: true
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p app/src/main/jniLibs/$abi
            for core in melonds:libmelonds fceumm:libfceumm snes9x:libsnes9x pcsx_rearmed:libpcsx_rearmed mednafen_pce_fast:libmednafen_pce_fast; do
              name=${core%%:*}; lib=${core##*:}
              if curl -fsSL "https://buildbot.libretro.com/nightly/android/latest/$abi/${name}_libretro_android.so.zip" -o /tmp/$name-$abi.zip \
                 && unzip -o -j /tmp/$name-$abi.zip -d /tmp/$name-$abi; then
                mv /tmp/$name-$abi/${name}_libretro_android.so app/src/main/jniLibs/$abi/$lib.so
                echo "Nucleo $name listo para $abi"
              else
                echo "AVISO: no se pudo descargar el nucleo $name para $abi (la app compila igual, sin ese sistema)"
              fi
            done
          done
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gba-library-app
          path: app/build/outputs/apk/release/*.apk
