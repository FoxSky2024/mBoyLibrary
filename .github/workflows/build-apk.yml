name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Descargar nucleo de Nintendo DS (melonDS, libretro)
        continue-on-error: true
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p app/src/main/jniLibs/$abi
            if curl -fsSL "https://buildbot.libretro.com/nightly/android/latest/$abi/melonds_libretro_android.so.zip" -o /tmp/melonds-$abi.zip \
               && unzip -o -j /tmp/melonds-$abi.zip -d /tmp/melonds-$abi; then
              mv /tmp/melonds-$abi/melonds_libretro_android.so app/src/main/jniLibs/$abi/libmelonds.so
              echo "Nucleo DS listo para $abi"
            else
              echo "AVISO: no se pudo descargar el nucleo DS para $abi (la app compila igual, sin DS)"
            fi
          done
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gba-library-app
          path: app/build/outputs/apk/release/*.apk
