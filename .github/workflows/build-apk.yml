name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: gradle:8.11-jdk17
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK
        run: |
          apt-get update && apt-get install -y wget unzip
          mkdir -p /opt/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmd.zip
          unzip -q /tmp/cmd.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          export ANDROID_HOME=/opt/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Build release APK
        run: |
          for i in 1 2 3; do
            echo "=== Intento $i ==="
            gradle :app:assembleRelease --no-daemon && break || sleep 30
          done
      - name: List APKs
        run: |
          pwd
          find . -name "*.apk" -ls
          ls -lh app/build/outputs/apk/release/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gba-library-app
          path: "**/*.apk"
